<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Crossy Run 3D - Gold Standard</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info {
            position: absolute; top: 10px; width: 100%;
            text-align: center; color: white; font-family: sans-serif;
            pointer-events: none; text-shadow: 1px 1px 2px black;
            z-index: 102; /* Sempre visível no topo */
        }
        
        /* Garante que o canvas do jogo fica no fundo */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; 
        }
    
        /* Garante que os menus ficam sempre à frente (z-index alto) */
        #main-menu, #game-ui, #game-over-screen {
            z-index: 100 !important;
            pointer-events: auto !important;
        }
    
        /* Estilo para o botão ter a certeza que aceita cliques */
        #btn-change-char {
            pointer-events: all !important;
            z-index: 101 !important;
        }

        /* Estilo para a caixa de seleção */
        .character-selection {
            margin: 20px 0;
            text-align: center;
        }

        .character-selection label {
            display: block;
            color: #FFD700; /* Amarelo Gold */
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        #char-select {
            appearance: none;
            background-color: #222;
            color: #fff;
            border: 3px solid #FFD700;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        #char-select:hover {
            background-color: #333;
            transform: scale(1.05);
        }

        #char-select:focus {
            border-color: #00ffff; /* Brilho azul cibernético ao selecionar */
            box-shadow: 0 0 10px #00ffff;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="info">Mover: WASD | Poder: ESPAÇO | Câmara: C</div>

    <div id="ui-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;">
        
        <div id="main-menu" style="pointer-events: auto; text-align: center;">
            <h1 style="color: white; font-family: 'Arial Black', sans-serif; font-size: 60px; text-shadow: 4px 4px 0 #cc0000; margin-bottom: 0;">CROSSY RUN</h1>
            <h2 style="color: #FFD700; font-family: 'Courier New', monospace; text-shadow: 2px 2px 0 #000; margin-top: 0; margin-bottom: 30px;">HIGH SCORE: <span id="menu-high-score">0</span></h2>
            
            <div class="character-selection" style="margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 30px;">
                <button id="btn-prev-char" style="font-size: 40px; background: none; border: none; color: #FFD700; cursor: pointer; text-shadow: 3px 3px 0 #000; transition: transform 0.2s;">◀</button>
                <div style="width: 250px; text-align: center;">
                    <h3 style="color: white; margin: 0; font-family: sans-serif; font-size: 16px; text-shadow: 2px 2px 0 #000;">HERÓI SELECIONADO:</h3>
                    <h2 id="char-name-display" style="color: #00ffff; margin: 5px 0 0 0; font-family: 'Arial Black', sans-serif; font-size: 22px; text-shadow: 2px 2px 0 #000; text-transform: uppercase;">O Cronometrista</h2>
                </div>
                <button id="btn-next-char" style="font-size: 40px; background: none; border: none; color: #FFD700; cursor: pointer; text-shadow: 3px 3px 0 #000; transition: transform 0.2s;">▶</button>
            </div>
        
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button id="btn-start" style="padding: 15px 30px; font-size: 24px; font-weight: bold; background: #FFD700; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 #b39700;">INICIAR JOGO</button>
                <button id="btn-edit-light" style="padding: 15px 30px; font-size: 18px; font-weight: bold; background: #444; color: white; border: 2px solid #888; border-radius: 10px; cursor: pointer;">AJUSTAR LUZ</button>
            </div>
        </div>

        <button id="btn-exit-edit" style="display: none; position: absolute; bottom: 30px; left: 30px; padding: 15px 25px; font-size: 18px; cursor: pointer; background: #cc0000; color: white; border: 3px solid #fff; border-radius: 10px; font-weight: bold; z-index: 10001; pointer-events: auto;">
            SAIR DO MODO ESTÚDIO
        </button>

        <div id="game-over-screen" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10; pointer-events: auto;">
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; font-family: 'Arial Black', sans-serif;">
                <h1 style="font-size: 80px; margin: 0; text-shadow: 4px 4px 0 #cc0000;">GAME OVER</h1>
                <p style="font-size: 24px; margin-top: 20px; animation: blink 1s infinite;">Pressiona <strong style="color: #FFD700;">ESPAÇO</strong> para Recomeçar</p>
            </div>
            
            <button id="btn-change-char" style="position: absolute; bottom: 30px; right: 30px; padding: 15px 25px; font-size: 18px; cursor: pointer; background: #002366; color: white; border: 3px solid #ffd700; border-radius: 10px; font-weight: bold;">
                MUDAR PERSONAGEM
            </button>
        </div>

        <div id="game-ui" style="display: none; position: absolute; top: 20px; left: 20px; pointer-events: none; width: 100%;">
            <h1 style="color: white; text-shadow: 2px 2px 0 #000; font-family: sans-serif; margin: 0;">Score: <span id="score-counter">0</span></h1>
            <h2 style="color: #FFD700; text-shadow: 2px 2px 0 #000; font-family: sans-serif; margin: 5px 0 0 0; font-size: 20px;">Best: <span id="best-score-counter">0</span></h2>
            <h3 style="color: white; text-shadow: 2px 2px 0 #000; font-family: sans-serif; margin-top: 5px;">Energia: <span id="energy-counter">0/10</span></h3>
            
            <div id="perf-bar" style="position: absolute; top: 0px; right: 40px; background: rgba(20, 20, 20, 0.85); border: 2px solid #555; border-radius: 8px; padding: 10px 20px; font-family: 'Courier New', monospace; font-weight: bold; display: flex; gap: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                <div style="text-align: center;">
                    <span style="color: #888; font-size: 11px; display: block; margin-bottom: 3px;">FPS</span>
                    <span id="ui-fps" style="color: #00ff00; font-size: 20px;">0</span>
                </div>
                <div style="width: 2px; background: #444;"></div>
                <div style="text-align: center;">
                    <span style="color: #888; font-size: 11px; display: block; margin-bottom: 3px;">CPU (ms)</span>
                    <span id="ui-ms" style="color: #00ffff; font-size: 20px;">0</span>
                </div>
                <div style="width: 2px; background: #444;"></div>
                <div style="text-align: center;">
                    <span style="color: #888; font-size: 11px; display: block; margin-bottom: 3px;">RAM</span>
                    <span id="ui-mem" style="color: #ff00ff; font-size: 20px;">0 MB</span>
                </div>
            </div>
        </div>

    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
